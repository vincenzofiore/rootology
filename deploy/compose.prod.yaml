# Rootology in production (#12, docs/operations.md): Caddy in front (HTTPS), the app, Postgres and Neo4j.
# Only Caddy publishes ports; the databases are reachable only inside this Compose network.
# Settings and secrets come from deploy/.env on the server (see .env.example), never from this repository.
# Memory limits sized for a 4 GB server (CX23).
name: rootology

services:
  caddy:
    image: caddy:2.11.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    mem_limit: 128m

  app:
    image: ghcr.io/vincenzofiore/rootology:${APP_VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rootology
      SPRING_DATASOURCE_USERNAME: rootology
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    mem_limit: 1200m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rootology
      POSTGRES_USER: rootology
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rootology -d rootology"]
      interval: 5s
      retries: 20
    mem_limit: 384m

  neo4j:
    # Rebuilt from the curated files at every start of the app: its data needs no backup.
    image: neo4j:2026.10.1-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 384m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 30
    mem_limit: 900m

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
