# Loaded by every Spring test besides application.yaml (classpath:/config/ is one of Spring Boot's default
# locations). No test calls MET Norway on its own: the forecast refresh of #67 stays off.
rootology.weather.refresh.enabled=false

# The test JVM shares one Postgres between all its Spring contexts (#98), and every cached context keeps
# its own connection pool. A small pool per context keeps the sum below the container's max_connections.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
