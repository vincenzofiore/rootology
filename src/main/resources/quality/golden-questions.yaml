  # Not refused; read as a question about a plot (as the live run of 2026-11-10 did), which needs a garden.
  # No garden to answer in: the person picks one (#107). This space has none, so the only way is a new one.
  - id: in-domain-terrace-pots
    question: Cosa posso seminare adesso nei vasi sul terrazzo?
    intent: {kind: SOW_IN_PLOT, subject: vasi sul terrazzo, language: it}
    expect: {choice: {kind: GARDEN}}

  - id: growing-now-without-garden
    question: Cosa cresce nel mio orto?
    intent: {kind: GROWING_NOW, language: it}
    expect: {choice: {kind: GARDEN}}

  # Question context (#55): only the garden the question is asked in, and never a guess.
  # Calendars by the garden's climate profile (#62, frost-shift-v1 on Vasto's CENTRO windows; values from
  # docs/climate-profile.md): Torino (205 m) has October as its last safe month, so the autumn sowings move one
  # month earlier and only garlic is still planted in November; Palermo has no frost, so it keeps Vasto's windows
  # (never earlier). A zone named in the question uses its reference site (NORD = Milano, Vasto's November
  # crops) and its curated rows win: broad bean's NORD window is February.
  - id: sow-now-in-the-northern-garden
    question: Cosa posso seminare adesso?
    intent: {kind: SOW_NOW, language: it}
    garden: two-gardens-north
    weather: missing
    expect:
      answer: [Aglio, Scalogno, Albicocco, Amarena, Ciliegio, Cotogno, Melo, Nettarina, Pero, Pesco, Susino, Gelso nero, Giuggiolo, Kaki, Kiwi, Uva da tavola, Mandorlo, Noce, Nocciolo, Castagno]
      notes: [not available]

  - id: sow-now-in-the-southern-garden
    question: Cosa posso seminare adesso?
    intent: {kind: SOW_NOW, language: it}
    garden: two-gardens-south
    weather: missing
    expect:
      answer: [Fava, Pisello, Aglio, Alloro, Aronia, Goji, Lampone, Mirtillo, Mora, Ribes nero, Ribes rosso,
               Uva spina, Rosmarino, Salvia, Scalogno, Albicocco, Amarena, Ciliegio, Cotogno, Melo, Nettarina,
               Pero, Pesco, Susino, Gelso nero, Giuggiolo, Kaki, Kiwi, Uva da tavola, Mandorlo, Noce, Nocciolo, Castagno]
      notes: [not available, on the coast]

  - id: growing-now-in-one-of-two-gardens
    question: Cosa cresce nel mio orto?
    intent: {kind: GROWING_NOW, language: it}
    garden: two-gardens-north
    weather: missing
    expect: {answer: [Aglio]}

  # A calendar question outside a garden, with no place and no zone: the person picks one of the gardens'
  # towns (#107). The choices replace the old default-zone answer and the old escalation.
  - id: sow-now-outside-a-garden-uses-no-garden
    question: Cosa posso seminare adesso?
    intent: {kind: SOW_NOW, language: it}
    garden: two-gardens-space
    weather: missing
    expect: {choice: {kind: PLACE, options: [Torino, Palermo]}}

  - id: pest-risk-outside-a-garden
    question: Cosa minaccia il mio orto questo mese?
    intent: {kind: PEST_RISK, language: it}
    garden: two-gardens-space
    weather: missing
    expect: {choice: {kind: GARDEN, options: [Orto di Torino, Orto di Palermo]}}

  # A place named in the question (#107): it is the site of the calendars, found by its exact name and its
  # own climate cell; inside a garden it wins over the garden, with a note. Two towns of the same name that
  # population cannot tell apart, and a name GeoNames does not know, are the person's choice.
  - id: sow-now-in-turin-place
    question: Cosa posso seminare adesso a Torino?
    intent: {kind: SOW_NOW, language: it, place: Torino}
    weather: missing
    expect:
      answer: [Aglio, Scalogno, Albicocco, Amarena, Ciliegio, Cotogno, Melo, Nettarina, Pero, Pesco, Susino, Gelso nero, Giuggiolo, Kaki, Kiwi, Uva da tavola, Mandorlo, Noce, Nocciolo, Castagno]
      notes: [not available]

