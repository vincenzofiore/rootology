      answer: [FEBRUARY, MARCH, APRIL, MAY]
      activities: {FEBRUARY: [SOW_SEEDBED], MARCH: [SOW_SEEDBED], APRIL: [TRANSPLANT], MAY: [TRANSPLANT]}

  # A crop named in the plural, as questions usually do (#108): the same answer as the singular.
