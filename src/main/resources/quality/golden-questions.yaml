# Golden questions (#20): real questions on the knowledge base with answers known in advance, written by
# hand from the curated files (src/main/resources/knowledge/, docs/*.md) and reviewed by the owner. Never
# computed by the pipeline's code: a change to a curated file or to the code that alters an answer fails
# the build until this file is updated on purpose.
#
# The suite runs as if today were `today`, in Italy. Offline (CI): Claude is mocked (the expected intent
# is returned for the question) and the stub decision layer decides, so every mismatch fails: a silent
# wrong answer, a missed escalation or an unexpected one. Live (-Plive): the real Claude reads the
# question and Jev decides; results are measured and recorded, not enforced.
#
# garden: none | rome (Aiuola A: tomato since 2026-09-01, lettuce since 2026-10-01; Aiuola B: pea
#   2026-03-01 to 2026-06-30; coordinates 41.90, 12.50, IT) | lyon (coordinates 45.76, 4.84, FR; one plot
#   "Planche", ground, with lettuce since 2026-10-01)
#   | two-gardens-north, two-gardens-south, two-gardens-space (one space with "Orto di Torino", 45.07, 7.69,
#   NORD, plot Aiuola with garlic since 2026-10-15, and "Orto di Palermo", 38.12, 13.36, SUD, plot Aiuola with
#   broad bean since 2026-10-20; asked in Turin, in Palermo, or outside both at the space level)
#   | balcony ("Balcone" in Palermo, 38.12, 13.36, SUD; one plot "Davanzale", container, declared part shade)
#   The question runs inside the fixture's garden (#55); with none, or two-gardens-space, at the space level.
# weather: missing (the service gives nothing) | frost (minimum -2.0 degrees all week)
# spaceFacts: contributed by a member of the asking space (#24), visible only to that space
# expect: answer (the exact set of values) or escalate (a part of the reason); notes: parts of the notes
#   (English text), checked on answers and on escalations (#60): whoever answers a waiting question must
#   see why it was not answered

today: 2026-11-04

cases:

  # Companions and antagonists: only what is declared, never reversed.
  - id: companions-tomato-it
    question: Quali piante sono compagne del pomodoro?
    intent: {kind: COMPANIONS, subject: pomodoro, language: it}
    expect: {answer: [Basilico, Cipolla, Prezzemolo, Carota]}

  - id: companions-tomato-en
    question: Which plants are companions of tomato?
    intent: {kind: COMPANIONS, subject: tomato, language: en}
    expect: {answer: [Basil, Onion, Parsley, Carrot]}

  - id: companions-garlic-none-declared
    question: Quali sono le compagne dell'aglio?
    intent: {kind: COMPANIONS, subject: aglio, language: it}
    expect: {answer: []}

  - id: antagonists-tomato
    question: Cosa non devo piantare vicino al pomodoro?
    intent: {kind: ANTAGONISTS, subject: pomodoro, language: it}
    expect: {answer: [Patata, Cavolfiore, Broccolo, Cavolo nero, Cavolo verza, Cavolo cappuccio, Finocchio]}

  - id: antagonists-fennel-not-reversed
    question: Cosa non va piantato vicino al finocchio?
    intent: {kind: ANTAGONISTS, subject: finocchio, language: it}
    expect: {answer: [Fagiolo, Peperone]}

  # Calendars (zone CENTRO by default).
  - id: sowing-tomato
    question: Quando si semina il pomodoro?
    intent: {kind: SOWING_TIME, subject: pomodoro, language: it}
    expect: {answer: [FEBRUARY, MARCH, APRIL, MAY]}

  - id: harvest-garlic
    question: Quando si raccoglie l'aglio?
    intent: {kind: HARVEST_TIME, subject: aglio, language: it}
    expect: {answer: [JUNE, JULY]}

  - id: sow-now-november
    question: Cosa posso seminare adesso?
    intent: {kind: SOW_NOW, language: it}
    expect: {answer: [Fava, Aglio, Pisello, Rosmarino, Salvia]}

  - id: sow-in-march-en
    question: What can I sow in March?
    intent: {kind: SOW_NOW, language: en, month: MARCH}
    expect:
      answer: [Basil, Cabbage, Carrot, Celery, Chard, Chili pepper, Eggplant, Leek, Lettuce, Onion, Parsley,
               Pea, Potato, Radish, Rocket, Rosemary, Sage, Spinach, Sweet pepper, Tomato]

  # Pests and diseases.
  - id: relevant-pests-tomato-summer
    question: Quali parassiti e malattie riguardano il pomodoro d'estate?
    intent: {kind: RELEVANT_PESTS, subject: pomodoro, season: SUMMER, language: it}
    expect:
      answer: [Alternariosi, Dorifora, Mosca bianca del tabacco, Mosca bianca delle serre, Muffa grigia,
               Nottua del pomodoro, Peronospora del pomodoro e della patata, Ragnetto rosso,
               Tignola del pomodoro (Tuta), Tripide occidentale]

  - id: active-seasons-colorado-beetle
    question: In quali stagioni è attiva la dorifora?
    intent: {kind: ACTIVE_SEASONS, subject: dorifora, language: it}
    expect: {answer: [SPRING, SUMMER]}

  - id: active-seasons-late-blight-en
    question: When is late blight active?
    intent: {kind: ACTIVE_SEASONS, subject: late blight, language: en}
    expect: {answer: [SPRING, SUMMER, AUTUMN]}

  # The space's garden.
  - id: growing-now
    question: Cosa cresce nel mio orto?
    intent: {kind: GROWING_NOW, language: it}
    garden: rome
    weather: missing
    expect: {answer: [Pomodoro, Lattuga]}

  - id: pest-risk-november
    question: Cosa minaccia il mio orto questo mese?
    intent: {kind: PEST_RISK, language: it}
    garden: rome
    weather: missing
    expect:
      answer: [Muffa grigia, Limaccia grigia, Peronospora della lattuga]
      notes: [not available]

  - id: sow-in-plot-after-peas
    question: Cosa posso seminare nell'aiuola B?
    intent: {kind: SOW_IN_PLOT, subject: Aiuola B, language: it}
    garden: rome
    weather: missing
    expect: {answer: [Aglio, Rosmarino, Salvia]}

  # Local weather (#18): frost-risk-v1 with ECOCROP's killing temperature for young plants.
  - id: frost-rules-out-pea
    question: Cosa posso seminare adesso nel mio orto?
    intent: {kind: SOW_NOW, language: it}
    garden: rome
    weather: frost
    expect:
      answer: [Fava, Aglio, Rosmarino, Salvia]
      notes: [frost-risk-v1, Pisello]

  - id: forecast-missing-answers-anyway
    question: Che cosa semino adesso?
    intent: {kind: SOW_NOW, language: it}
    garden: rome
    weather: missing
    expect:
      answer: [Fava, Aglio, Pisello, Rosmarino, Salvia]
      notes: [not available]

  # Facts added by a space (#24): visible only there.
  - id: space-alias-in-its-space
    question: Quali piante sono compagne del pomodorino?
    intent: {kind: COMPANIONS, subject: pomodorino, language: it}
    spaceFacts: [{alias: tomato, name: pomodorino, language: it}]
    expect: {answer: [Basilico, Cipolla, Prezzemolo, Carota]}

  - id: space-alias-not-in-another-space
    question: Quali piante sono compagne del pomodorino?
    intent: {kind: COMPANIONS, subject: pomodorino, language: it}
    expect: {escalate: not in the dataset}

  # Questions that must go to a person.
  - id: unknown-crop
    question: Quali sono le compagne della lavanda?
    intent: {kind: COMPANIONS, subject: lavanda, language: it}
    expect: {escalate: not in the dataset}

  # A plain weather forecast is not about the garden (#53): refused, where it used to wait for a person.
  - id: out-of-scope
    question: Che tempo farà domani a Roma?
    intent: {kind: OTHER, language: it}
    expect: {offDomain: true}

  # The domain filter (#53): only a question clearly outside gardens is refused, with no answer and no
  # escalation. The intent is what Claude would understand if the question reached it; a refused question
  # never does. Questions that only look odd must not be refused: they take the normal path.
  - id: off-domain-sewing
    question: Come si fa il punto zig-zag con la macchina da cucire?
    intent: {kind: OTHER, language: it}
    expect: {offDomain: true}

  - id: off-domain-car
    question: Ogni quanto devo cambiare le gomme della macchina?
    intent: {kind: OTHER, language: it}
    expect: {offDomain: true}

  - id: off-domain-taxes-en
    question: How do I file my tax return?
    intent: {kind: OTHER, language: en}
    expect: {offDomain: true}

  - id: off-domain-ants-in-the-kitchen
    question: Come elimino le formiche in cucina?
    intent: {kind: OTHER, language: it}
    expect: {offDomain: true}

  - id: in-domain-compost
    question: Posso mettere le bucce d'arancia nel compost?
    intent: {kind: OTHER, language: it}
    expect: {escalate: does not fit}

  - id: in-domain-chickens
    question: Le galline nell'orto rovinano le piantine?
    intent: {kind: OTHER, language: it}
    expect: {escalate: does not fit}

  - id: in-domain-lawn-fertiliser
    question: Che concime uso per il prato?
    intent: {kind: OTHER, language: it}
    expect: {escalate: does not fit}

  - id: in-domain-frost-worry
    question: Stanotte gela, devo coprire la lattuga?
    intent: {kind: OTHER, language: it}
    expect: {escalate: does not fit}

  # Not refused; read as a question about a plot (as the live run of 2026-11-10 did), which needs a garden.
  - id: in-domain-terrace-pots
    question: Cosa posso seminare adesso nei vasi sul terrazzo?
    intent: {kind: SOW_IN_PLOT, subject: vasi sul terrazzo, language: it}
    expect:
      escalate: needs a garden
      notes: [inside one of the space's gardens]

  - id: growing-now-without-garden
    question: Cosa cresce nel mio orto?
    intent: {kind: GROWING_NOW, language: it}
    expect:
      escalate: needs a garden
      notes: [inside one of the space's gardens]

  # Question context (#55): only the garden the question is asked in, and never a guess.
  # Calendars by the garden's climate profile (#62, frost-shift-v1 on Vasto's CENTRO windows; values from
  # docs/climate-profile.md): Torino (205 m) has October as its last safe month, so the autumn sowings move one
  # month earlier and only garlic is still planted in November; Palermo has no frost, so it keeps Vasto's windows
  # (never earlier). A zone named in the question uses its reference site (NORD = Milano, Vasto's November
  # crops) and its curated rows win: broad bean's NORD window is February.
  - id: sow-now-in-the-northern-garden
    question: Cosa posso seminare adesso?
    intent: {kind: SOW_NOW, language: it}
    garden: two-gardens-north
    weather: missing
    expect:
      answer: [Aglio]
      notes: [not available]

  - id: sow-now-in-the-southern-garden
    question: Cosa posso seminare adesso?
    intent: {kind: SOW_NOW, language: it}
    garden: two-gardens-south
    weather: missing
    expect:
      answer: [Fava, Pisello, Aglio, Rosmarino, Salvia]
      notes: [not available, on the coast]

  - id: growing-now-in-one-of-two-gardens
    question: Cosa cresce nel mio orto?
    intent: {kind: GROWING_NOW, language: it}
    garden: two-gardens-north
    weather: missing
    expect: {answer: [Aglio]}

  - id: sow-now-outside-a-garden-uses-no-garden
    question: Cosa posso seminare adesso?
    intent: {kind: SOW_NOW, language: it}
    garden: two-gardens-space
    weather: missing
    expect:
      answer: [Fava, Aglio, Pisello, Rosmarino, Salvia]
      notes: [outside a garden]

  - id: pest-risk-outside-a-garden
    question: Cosa minaccia il mio orto questo mese?
    intent: {kind: PEST_RISK, language: it}
    garden: two-gardens-space
    weather: missing
    expect:
      escalate: needs a garden
      notes: [inside one of the space's gardens]

  - id: question-zone-wins-over-the-garden
    question: Cosa posso seminare adesso al nord?
    intent: {kind: SOW_NOW, language: it, zone: NORD}
    garden: rome
    weather: missing
    expect:
      answer: [Pisello, Aglio, Rosmarino, Salvia]
      notes: [names zone NORD, but the garden is in zone CENTRO]

  - id: plot-not-in-the-garden
    question: Cosa posso seminare nell'aiuola C?
    intent: {kind: SOW_IN_PLOT, subject: Aiuola C, language: it}
    garden: rome
    weather: missing
    expect:
      escalate: the plot is not in this garden
      notes: [no plot named "Aiuola C"]

  - id: plot-name-matching-two-plots
    question: Cosa posso seminare nell'aiuola?
    intent: {kind: SOW_IN_PLOT, subject: Aiuola, language: it}
    garden: rome
    weather: missing
    expect:
      escalate: the plot is not in this garden
      notes: [More than one plot]

  # The plot's declared exposure (#54) added by the app, not named in the question. Part shade: crops that
  # ECOCROP gives "very bright" are left out (broad bean, pea, rosemary, sage). Palermo keeps Vasto's windows
  # (#62), so in November only garlic ("clear skies") is left.
  - id: sow-on-the-windowsill-in-part-shade
    question: Cosa posso seminare adesso nel davanzale?
    intent: {kind: SOW_IN_PLOT, subject: davanzale, language: it}
    garden: balcony
    weather: missing
    expect:
      answer: [Aglio]
      notes: [light-need-v1, on the coast]

  - id: calendar-abroad
    question: Quando semino il pomodoro?
    intent: {kind: SOWING_TIME, subject: pomodoro, language: it}
    garden: lyon
    expect:
      answer: [FEBRUARY, MARCH, APRIL, MAY]
      notes: [those of central Italy]

  # No calendar note for a pest question abroad (#58): the pest months and the weather apply there too.
  - id: pest-risk-abroad
    question: Cosa minaccia il mio orto questo mese?
    intent: {kind: PEST_RISK, language: it}
    garden: lyon
    weather: missing
    expect:
      answer: [Muffa grigia, Limaccia grigia, Peronospora della lattuga]

  - id: active-season-of-a-crop
    question: In quale stagione è attivo il pomodoro?
    intent: {kind: ACTIVE_SEASONS, subject: pomodoro, language: it}
    expect: {escalate: not declared}

  - id: shared-repellers-not-declared
    question: Quali sono le compagne delle piante che respingono gli stessi parassiti del pomodoro?
    intent: {kind: COMPANIONS_OF_SHARED_REPELLERS, subject: pomodoro, language: it}
    expect: {escalate: repels}
