spring:
  application:
    name: rootology
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks it.
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          github:
            # From the GitHub OAuth App. The placeholders let the app start; login needs the real values.
            client-id: ${ROOTOLOGY_GITHUB_CLIENT_ID:not-set}
            client-secret: ${ROOTOLOGY_GITHUB_CLIENT_SECRET:not-set}

embabel:
  models:
    default-llm: claude-sonnet-5-5
  agent:
    platform:
      # Each action runs once: by default Embabel retries a failing action up to 5 times over minutes,
      # which keeps a person waiting while a service is down; Claude's calls retry briefly below (#29).
      action-qos:
        default:
          max-attempts: 1
      llm-operations:
        prompts:
          default-timeout: 30s
      models:
        anthropic:
          # Few, short retries: with the defaults (10 attempts, backoff from 5 s up to 3 min) a question
          # could wait for many minutes while Anthropic is down (#29).
          max-attempts: 3
          backoff-millis: 1000
          backoff-multiplier: 2
          backoff-max-interval: 4000
          # Project-specific name, so the key does not leak into Claude Code itself (which reads ANTHROPIC_API_KEY).
          # The placeholder lets the context start without a key; real LLM calls need it set.
          api-key: ${ROOTOLOGY_ANTHROPIC_API_KEY:not-set}

rootology:
  jev:
    # Same convention as above. Without a key the deterministic StubDecisionLayer is used.
    api-key: ${ROOTOLOGY_TYPESAFE_API_KEY:}
    base-url: https://api.typesafe.ai
    model: jev-latest
  weather:
    # MET Norway asks every app to identify itself, with a way to reach its maintainer.
    base-url: https://api.met.no
    user-agent: rootology/0.1 (+https://github.com/vincenzofiore/rootology)
  knowledge:
    # GitHub logins (comma-separated) who review facts proposed for everyone (#24). Empty means nobody.
    curators: ${ROOTOLOGY_CURATORS:}
  security:
    # GitHub accounts (logins, comma-separated) allowed into the UI. Empty means nobody.
    allowed-github-users: ${ROOTOLOGY_ALLOWED_GITHUB_USERS:}
