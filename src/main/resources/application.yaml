spring:
  application:
    name: rootology
  task:
    scheduling:
      pool:
        # The Telegram long poll (#38) holds a thread for up to 25 s; with Spring's default of one thread
        # it would delay the digests, the alerts and the retention job every time.
        size: 4
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks it.
      ddl-auto: validate
  security:
    oauth2:
      client:
        registration:
          github:
            # From the GitHub OAuth App. The placeholders let the app start; login needs the real values.
            client-id: ${ROOTOLOGY_GITHUB_CLIENT_ID:not-set}
            client-secret: ${ROOTOLOGY_GITHUB_CLIENT_SECRET:not-set}
            # user:email reads the verified addresses, so an invitation can be bound to one (#25).
            scope: read:user,user:email
          # OpenID Connect (#28): a person is recognised by Google's sub. Spring Boot knows Google's provider.
          google:
            client-id: ${ROOTOLOGY_GOOGLE_CLIENT_ID:not-set}
            client-secret: ${ROOTOLOGY_GOOGLE_CLIENT_SECRET:not-set}
            scope: openid,email,profile

  # Outgoing email (#25). Without settings it goes to Mailpit (compose.yaml), which keeps it locally. For Gmail:
  # host smtp.gmail.com, port 587, auth and starttls true, an app password of the app's dedicated account.
  mail:
    host: ${ROOTOLOGY_SMTP_HOST:localhost}
    port: ${ROOTOLOGY_SMTP_PORT:1025}
    username: ${ROOTOLOGY_SMTP_USERNAME:}
    password: ${ROOTOLOGY_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${ROOTOLOGY_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${ROOTOLOGY_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

embabel:
  models:
    default-llm: claude-sonnet-5-5
  agent:
    platform:
      # Each action runs once: by default Embabel retries a failing action up to 5 times over minutes,
      # which keeps a person waiting while a service is down; Claude's calls retry briefly below (#29).
      action-qos:
        default:
          max-attempts: 1
      llm-operations:
        prompts:
          default-timeout: 30s
      models:
        anthropic:
          # Few, short retries: with the defaults (10 attempts, backoff from 5 s up to 3 min) a question
          # could wait for many minutes while Anthropic is down (#29).
          max-attempts: 3
          backoff-millis: 1000
          backoff-multiplier: 2
          backoff-max-interval: 4000
          # Project-specific name, so the key does not leak into Claude Code itself (which reads ANTHROPIC_API_KEY).
          # The placeholder lets the context start without a key; real LLM calls need it set.
          api-key: ${ROOTOLOGY_ANTHROPIC_API_KEY:not-set}

server:
  servlet:
    session:
      cookie:
        # The session cookie is not sent on cross-site requests (#41); Secure comes with HTTPS in #12.
        same-site: lax

management:
  # Health is public with status only (#41); metrics are for signed-in admins (#27).
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Ready when Postgres and Neo4j answer; external services only make it DEGRADED, still ready (#27, #29).
        readiness:
          include: readinessState,db,neo4j,externalServices
  health:
    status:
      order: DOWN, OUT_OF_SERVICE, DEGRADED, UP, UNKNOWN
      http-mapping:
        degraded: 200
    mail:
      # Email goes out in the background with retries (#25): an unreachable SMTP server is not the app being down.
      enabled: false

rootology:
  # The app's public address, for links in emails (#25).
  base-url: ${ROOTOLOGY_BASE_URL:http://localhost:8080}
  map:
    # The map of the gardens overview (#66): OpenFreeMap's Liberty style, free, no key and no cookies, one
    # style for light and dark. Style, tiles, glyphs and sprites all come from tiles.openfreemap.org, which
    # has no SLA and may stop: keep the URL here, not in the code, and the table works when the map does not.
    style-url: https://tiles.openfreemap.org/styles/liberty
  privacy:
    # Named on the public privacy page (#40); set per deployment, not in the repository.
    controller: ${ROOTOLOGY_PRIVACY_CONTROLLER:}
    contact: ${ROOTOLOGY_PRIVACY_CONTACT:}
  retention:
    # How long personal data is kept (#40, docs/privacy.md); applied every night and shown on /privacy.
    cron: "0 30 3 * * *"
    history: P365D
    usage: P365D
    escalations: P90D
    notifications: P90D
    invitations: P30D
    # Telegram one-time codes, and links Telegram stopped delivering to (#38).
    telegram: P30D
    # Invitation requests (#65): a rejected one after the waiting time, a waiting or unused approved one after
    # 90 days, so a forgotten request does not stay forever.
    rejected-access-requests: P30D
    pending-access-requests: P90D
  mail:
    from: ${ROOTOLOGY_SMTP_FROM:Rootology <rootology@localhost>}
  alerts:
    # Weather alerts (#37): every morning at 7, Italian time.
    cron: "0 0 7 * * *"
  operations:
    # Operational alerts to the admins (#27): an open circuit or a nearly full disk, checked this often.
    check-every: PT1M
    disk-path: /
    disk-threshold: 0.9
  notifications:
    # Emails of waiting questions (#26): grouped once at least this old, checked this often.
    group-window: PT2M
    digest-every: PT1M
  invitations:
    # Invitations each owner may create per day (#25).
    daily-limit: 20
  access-requests:
    # Invitation requests (#65) created per day in Italian time, everyone together; then nobody may ask until
    # tomorrow. A rejected person may ask again after retry-after.
    daily-limit: 10
    retry-after: P30D
  telegram:
    # Notifications on the phone (#38), through a bot of the owner's. Empty token: the feature is hidden,
    # as place search is without a GeoNames account. The token is in every request path: it is never logged.
    base-url: https://api.telegram.org
    bot-token: ${ROOTOLOGY_TELEGRAM_BOT_TOKEN:}
    # A link code lives this long and works once; the deep link carries it.
    code-validity: PT10M
    # Long polling: how long one getUpdates may wait, and the pause between two of them.
    poll-timeout: PT25S
    poll-every: PT1S
    # One message per person at least this often, so a burst of alerts arrives as one notification.
    send-every: PT10S
  jev:
    # Same convention as above. Without a key the deterministic StubDecisionLayer is used.
    api-key: ${ROOTOLOGY_TYPESAFE_API_KEY:}
    base-url: https://api.typesafe.ai
    model: jev-latest
  usage:
    # Questions each person may ask per day (#19), unless an admin set a personal limit.
    daily-questions: 30
  geonames:
    # A free GeoNames account with "free web services" enabled; empty means place search is not offered.
    base-url: https://secure.geonames.org
    username: ${ROOTOLOGY_GEONAMES_USERNAME:}
  weather:
    # MET Norway asks every app to identify itself, with a way to reach its maintainer.
    base-url: https://api.met.no
    user-agent: rootology/0.1 (+https://github.com/vincenzofiore/rootology)
    refresh:
      # Every garden's forecast is kept fresh for the map's popups (#67), which read only stored copies
      # (at most 12 hours old); a new place is fetched at once. Off in tests.
      enabled: true
      cron: "0 20 */6 * * *"
  security:
    # GitHub accounts (logins, comma-separated) allowed into the UI. Empty means nobody.
    allowed-github-users: ${ROOTOLOGY_ALLOWED_GITHUB_USERS:}
    # Google accounts (verified emails, comma-separated) allowed in without an invitation (#28). Empty means nobody.
    allowed-google-emails: ${ROOTOLOGY_ALLOWED_GOOGLE_EMAILS:}
