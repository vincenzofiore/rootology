spring:
  application:
    name: rootology
  security:
    oauth2:
      client:
        registration:
          github:
            # From the GitHub OAuth App. The placeholders let the app start; login needs the real values.
            client-id: ${ROOTOLOGY_GITHUB_CLIENT_ID:not-set}
            client-secret: ${ROOTOLOGY_GITHUB_CLIENT_SECRET:not-set}

embabel:
  models:
    default-llm: claude-sonnet-5-5
  agent:
    platform:
      models:
        anthropic:
          # Project-specific name, so the key does not leak into Claude Code itself (which reads ANTHROPIC_API_KEY).
          # The placeholder lets the context start without a key; real LLM calls need it set.
          api-key: ${ROOTOLOGY_ANTHROPIC_API_KEY:not-set}

rootology:
  jev:
    # Same convention as above. Without a key the deterministic StubDecisionLayer is used.
    api-key: ${ROOTOLOGY_TYPESAFE_API_KEY:}
    base-url: https://api.typesafe.ai
    model: jev-latest
  security:
    # GitHub accounts (logins, comma-separated) allowed into the UI. Empty means nobody.
    allowed-github-users: ${ROOTOLOGY_ALLOWED_GITHUB_USERS:}
