nav.privacy=Privacy
privacy.title=Privacy
privacy.who.title=Who is responsible for your data
privacy.who.text=The controller is {0}. For any question or request about your data, write to {1}.
privacy.who.missing=The owner of this installation has not yet given a name and contact.
privacy.what.title=What data we process
privacy.what.account=Your account: your login, your GitHub or Google account with the identifier that service gives us and the address it verified, and, if you choose, the email address for notifications with quiet hours. The other verified addresses are used only during the session, to accept an invitation or suggest an address.
privacy.what.garden=Your garden: name, town, country and coordinates rounded to about 1 km, the areas, what you sowed or planted and when, with the notes you write.
privacy.what.questions=Your questions and the answers, who asked and who answered when a question waits for a person, and the context the answer was given in (the garden’s and area’s names, the zone and month used).
privacy.what.notifications=Notifications in the app and by email.
privacy.what.usage=How many questions you ask and what they cost, for the daily limits.
privacy.what.proposals=The facts you propose for the knowledge base, with their source and who approved them.
privacy.what.nothingelse=We do not use the data for advertising or profiling and we do not sell it.
privacy.why.title=Why, and on what basis
privacy.why.text=We process this data to provide the service you asked for (performance of a contract): answering questions about your garden, sharing it with the people you invite, warning you about the weather and waiting questions. Usage records, the history of roles and the attribution of proposed facts serve security, cost control and the traceability of the knowledge (legitimate interest).
privacy.who-receives.title=Who receives it
privacy.receives.anthropic=Anthropic (Claude, USA): the text of your questions, the names of the space’s gardens and of the current garden’s areas (to recognise one the question names), and the facts to phrase the answer. It deletes the data within 30 days and does not use it to train models.
privacy.receives.typesafe=TypeSafe (Jev, USA): the question text to check whether it is about gardens, then the question as understood (kind, crop or area, zone, month) and the facts, never your login. It does not use them to train models.
privacy.receives.github=GitHub (USA): signing in with your GitHub account, under GitHub’s privacy statement.
privacy.receives.google=Google (USA): signing in with your Google account, only to recognise you, under Google’s privacy statement.
privacy.receives.mail=The email service that sends notifications and invitations: the address and the text of the message.
privacy.receives.places=GeoNames (Switzerland): the place names you search and the garden’s rounded position, to find the town.
privacy.receives.weather=MET Norway (Norway): the garden’s rounded position, for the forecast.
privacy.receives.map=OpenFreeMap (tiles.openfreemap.org, behind Cloudflare): the part of the map you are looking at and your IP address, never the gardens’ names or the space. It keeps anonymised access logs and error logs with the IP for 7 days.
privacy.receives.telegram=Telegram (Telegram’s servers in Europe): the space, the garden, the title of the alert and the link to open it, only if you link Telegram. The question, the answer and the alert text stay here; Telegram keeps bot messages like any chat.
privacy.receives.transfers=For Anthropic and TypeSafe, the transfer to the USA is covered by the EU standard contractual clauses in their data processing agreements; GitHub and Google take part in the EU-US Data Privacy Framework.
privacy.receives.questions=Questions are free text: do not write personal data about you or others in them.
privacy.kept.title=For how long
privacy.kept.history=Questions and answers: {0,number,#} days.
privacy.kept.escalations=Questions that waited for a person, after the answer: {0,number,#} days.
privacy.kept.notifications=Notifications, once read or resolved: {0,number,#} days.
privacy.kept.usage=Usage records: {0,number,#} days.
privacy.kept.invitations=Invitations accepted, revoked or expired: {0,number,#} days; the invited email address is cleared at once.
privacy.kept.telegram=Telegram codes, and links Telegram no longer delivers to: {0,number,#} days; a working link stays until you unlink it.
privacy.kept.weather=Weather forecasts for the rounded position: 30 days.
privacy.kept.account=Account, garden and proposed facts: as long as you keep them or until you delete your account.
privacy.rights.title=Your rights
privacy.rights.text=You can see and correct your data in the app, download it as a file and delete your account from the My account page. Deleting the account removes your personal space with everything in it, your preferences, notifications and usage; in what stays in shared spaces your login becomes “deleted user”. To object to or restrict processing, or for any other request, write to the contact above.
privacy.rights.complaint=You can also lodge a complaint with the Italian data protection authority, the Garante per la protezione dei dati personali (www.garanteprivacy.it).
privacy.cookies.title=Cookies and browser storage
privacy.cookies.text=We use only what the app needs: no profiling cookies, no advertising cookies, nothing to accept in a banner. This is what your browser keeps for Rootology.
privacy.cookies.session=The session cookie, named JSESSIONID: it holds your sign-in and the interface. The same session keeps, for the length of the sign-in, the token of an invitation you opened, the marker of a second account being linked and the state of the sign-in in progress. It cannot be read by JavaScript (HttpOnly), it is not sent with requests other sites make behind the scenes (SameSite=Lax) and, when the app is on HTTPS, it only travels over HTTPS (Secure). It ends at sign-out or {0,number,#} minutes after you close the app (while one of its pages is open, the session stays active), and it is gone anyway when you close the browser.
privacy.cookies.theme=The light, dark or automatic theme choice, in the browser’s local storage under rootology.colorScheme. It stays until you clear the browser’s data, it does not expire and it never reaches our servers.
privacy.cookies.gardenview=The choice to see the map, the table or both in the gardens, in the browser’s local storage under rootology.gardenView. It stays until you clear the browser’s data, it does not expire and it never reaches our servers.
privacy.cookies.providers=While you sign in, GitHub and Google set their own cookies on their own domains, under their own rules (docs.github.com/en/site-policy/privacy-policies/github-subprocessors-and-cookies and policies.google.com/technologies/cookies): we neither see nor control them.
