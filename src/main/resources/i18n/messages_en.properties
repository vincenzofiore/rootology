account.delete.title=Delete the account
account.delete.text=This deletes your personal space and the spaces where you are the only person, with everything in them, your preferences, notifications, usage and open invitations. In shared spaces what remains (questions, answers, approved facts) stays, with “deleted user” instead of your login. It cannot be undone.
