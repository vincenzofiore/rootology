welcome.page=Welcome
welcome.title=Rootology, the assistant for your vegetable garden
welcome.lead=Rootology answers questions about your garden from facts that have a source. When it is not sure it says so, and hands the question to a person in your space.
welcome.cycle=How it works: you ask, artificial intelligence checks the facts and their sources, your garden grows. And round again.
welcome.sources.title=Answers with their sources
welcome.sources.text=Companion plants, sowing, harvest, pests and weather from checked sources: every fact tells where it comes from.
welcome.sources.drawing=A robot studies a botany book, next to a pile of books and the weather.
welcome.unsure.title=It does not guess
welcome.unsure.text=When the facts are not enough it says so, and the question goes to a person in your space.
welcome.unsure.drawing=The robot shrugs, full of question marks. A farmer and a teacher with her finger raised have the right idea.
welcome.warns.title=It sees problems coming
welcome.warns.text=It follows your garden’s forecast and warns you of frost and late blight before they arrive.
welcome.warns.drawing=A thoughtful robot looks at a weather station in the snow and imagines a frozen seedling.
welcome.spaces.title=A garden to share
welcome.spaces.text=A space for your family or your community garden, with people who take part and people who only look.
welcome.spaces.drawing=An adult and a child water a seedling together.
welcome.denied=This account does not have access to Rootology yet. To get in you need an invitation from someone who already uses it.

