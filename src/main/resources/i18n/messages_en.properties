welcome.page=Welcome
welcome.title=Rootology, the assistant for your vegetable garden
welcome.lead=Rootology answers questions about your garden from facts that have a source. When it is not sure it says so, and hands the question to a person in your space.
welcome.sources.title=Answers with their sources
welcome.sources.text=Companion plants, sowing, harvest, pests and diseases from a curated knowledge base: every fact has its source.
welcome.unsure.title=It knows when it does not know
welcome.unsure.text=When the facts are not enough, the question waits for a person to answer, and Rootology remembers who did.
welcome.weather.title=Your garden’s weather
welcome.weather.text=The forecast for your garden, and frost and late blight alerts for what you grow.
welcome.spaces.title=Shared gardens
welcome.spaces.text=A space for your family or your community garden, with members who take part and guests who look.
welcome.access=For now Rootology is by invitation only: ask someone who already uses it for a link. If you already have an account, sign in.
