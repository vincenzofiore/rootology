welcome.page=Benvenuto
welcome.title=Rootology, l’assistente per il tuo orto
welcome.lead=Rootology risponde alle domande sul tuo orto partendo da fatti con una fonte. Quando non è sicuro lo dice, e passa la domanda a una persona del tuo spazio.
welcome.sources.title=Risposte con le fonti
welcome.sources.text=Consociazioni, semine, raccolti, parassiti e malattie da una base di conoscenza curata: ogni fatto ha la sua fonte.
welcome.unsure.title=Sa quando non sa
welcome.unsure.text=Se i fatti non bastano, la domanda aspetta la risposta di una persona, e Rootology ricorda chi ha risposto.
welcome.weather.title=Il meteo del tuo orto
welcome.weather.text=Le previsioni per il tuo orto e gli avvisi di gelo e di peronospora per quello che coltivi.
welcome.spaces.title=Orti condivisi
welcome.spaces.text=Uno spazio per la famiglia o per l’orto comune, con membri che partecipano e ospiti che guardano.
welcome.access=Per ora si entra solo su invito: chiedi il link a chi usa già Rootology. Se hai già un account, accedi; altrimenti chiedi un invito dopo aver effettuato l’accesso.
welcome.denied=Questo account non ha ancora accesso a Rootology. Per entrare serve un invito da chi lo usa già.
welcome.mascot=Il ravanello di Rootology

