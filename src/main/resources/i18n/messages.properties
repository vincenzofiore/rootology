account.export.text=Un file JSON con il tuo account, gli spazi a cui appartieni e i loro orti, le domande che hai fatto o a cui hai risposto, le notifiche, le preferenze, l’utilizzo, i fatti che hai proposto e i tuoi ruoli. Le domande degli altri negli spazi condivisi sono loro e non sono incluse.
account.export.button=Scarica i miei dati
account.delete.title=Cancella l’account
account.delete.text=Si eliminano il tuo spazio personale e gli spazi in cui sei l’unica persona, con tutto ciò che contengono, le tue preferenze, notifiche, utilizzo e inviti aperti. Negli spazi condivisi ciò che resta (domande, risposte, fatti approvati) rimane, con «utente rimosso» al posto del tuo login. Non si può annullare.
account.delete.spaces=Questi spazi verranno eliminati, anche per chi vi è stato invitato:
account.delete.blocked.owner=Nessun altro è owner di questi spazi, che altre persone usano: prima nomina un altro owner o rimuovi gli altri membri.
account.delete.blocked.admin=Nell’app non ci sono altri amministratori: prima nominane un altro.
