nav.privacy=Privacy
privacy.title=Privacy
privacy.who.title=Chi è responsabile dei tuoi dati
privacy.who.text=Il titolare del trattamento è {0}. Per qualsiasi domanda o richiesta sui tuoi dati scrivi a {1}.
privacy.who.missing=Il titolare di questa installazione non ha ancora indicato nome e contatto.
privacy.what.title=Quali dati trattiamo
privacy.what.account=Il tuo account: il login GitHub e, se lo scegli, l’indirizzo email per le notifiche con gli orari di silenzio. Gli indirizzi verificati su GitHub servono solo durante la sessione, per accettare un invito o proporti un indirizzo.
privacy.what.garden=Il tuo orto: nome, comune, paese e coordinate arrotondate a circa 1 km, le aiuole, cosa hai seminato o trapiantato e quando, con le note che scrivi.
privacy.what.questions=Le tue domande e le risposte, chi ha chiesto e chi ha risposto quando una domanda attende una persona.
privacy.what.notifications=Le notifiche nell’app e via email.
privacy.what.usage=Quante domande fai e quanto costano, per i limiti giornalieri.
privacy.what.proposals=I fatti che proponi per la base di conoscenza, con la fonte e chi li ha approvati.
privacy.what.nothingelse=Non usiamo i dati per pubblicità o profilazione e non li vendiamo.
privacy.why.title=Perché e su quale base
privacy.why.text=Trattiamo questi dati per fornirti il servizio che hai chiesto (esecuzione del contratto): rispondere alle domande sul tuo orto, condividerlo con chi inviti, avvisarti di meteo e domande in attesa. I registri di utilizzo, lo storico dei ruoli e l’attribuzione dei fatti proposti servono per la sicurezza, il controllo dei costi e la tracciabilità della conoscenza (legittimo interesse).
privacy.who-receives.title=Chi li riceve
privacy.receives.anthropic=Anthropic (Claude, USA): il testo delle tue domande e i fatti per formulare la risposta. Cancella i dati entro 30 giorni e non li usa per addestrare i modelli.
privacy.receives.typesafe=TypeSafe (Jev, USA): la domanda come è stata capita (tipo, coltura o aiuola, zona, mese) e i fatti, mai il testo né il tuo login. Non li usa per addestrare i modelli.
privacy.receives.github=GitHub (USA): l’accesso con il tuo account GitHub, secondo la privacy di GitHub.
privacy.receives.mail=Il servizio email che invia notifiche e inviti: l’indirizzo e il testo del messaggio.
privacy.receives.places=GeoNames (Svizzera): i nomi dei luoghi che cerchi e la posizione arrotondata dell’orto, per trovare il comune.
privacy.receives.weather=MET Norway (Norvegia): la posizione arrotondata dell’orto, per le previsioni.
privacy.receives.transfers=Per Anthropic e TypeSafe il trasferimento negli USA è regolato dalle clausole contrattuali standard dell’UE nei loro accordi sul trattamento dei dati; GitHub aderisce all’EU-US Data Privacy Framework.
privacy.receives.questions=Le domande sono testo libero: non scriverci dati personali tuoi o di altri.
privacy.kept.title=Per quanto tempo
privacy.kept.history=Domande e risposte: {0,number,#} giorni.
privacy.kept.escalations=Domande che attendevano una persona, dopo la risposta: {0,number,#} giorni.
privacy.kept.notifications=Notifiche, dopo che sono lette o risolte: {0,number,#} giorni.
privacy.kept.usage=Registri di utilizzo: {0,number,#} giorni.
privacy.kept.invitations=Inviti accettati, revocati o scaduti: {0,number,#} giorni; l’indirizzo email dell’invitato si cancella subito.
privacy.kept.weather=Previsioni meteo della posizione arrotondata: 30 giorni.
privacy.kept.account=Account, orto e fatti proposti: finché li tieni o cancelli l’account.
privacy.rights.title=I tuoi diritti
privacy.rights.text=Puoi vedere e correggere i tuoi dati nell’app, scaricarli in un file e cancellare il tuo account dalla pagina Il mio account. Cancellando l’account si eliminano il tuo spazio personale con tutto il suo contenuto, le preferenze, le notifiche e l’utilizzo; in ciò che resta negli spazi condivisi il tuo login diventa «utente rimosso». Per opporti a un trattamento, limitarlo o per qualsiasi altra richiesta scrivi al contatto qui sopra.
privacy.rights.complaint=Puoi anche presentare reclamo al Garante per la protezione dei dati personali (www.garanteprivacy.it).
privacy.cookies.title=Cookie
privacy.cookies.text=Usiamo solo il cookie di sessione, necessario per l’accesso. La scelta del tema chiaro o scuro resta nel tuo browser. Nessun cookie di profilazione o di terze parti.
