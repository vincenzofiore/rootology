nav.privacy=Privacy
privacy.title=Privacy
privacy.who.title=Chi è responsabile dei tuoi dati
privacy.who.text=Il titolare del trattamento è {0}. Per qualsiasi domanda o richiesta sui tuoi dati scrivi a {1}.
privacy.who.missing=Il titolare di questa installazione non ha ancora indicato nome e contatto.
privacy.what.title=Quali dati trattiamo
privacy.what.account=Il tuo account: il login, il tuo account GitHub o Google con l’identificativo che quel servizio ci dà e l’indirizzo che ha verificato, e, se lo scegli, l’indirizzo email per le notifiche con gli orari di silenzio. Gli altri indirizzi verificati servono solo durante la sessione, per accettare un invito o proporti un indirizzo.
privacy.what.garden=Il tuo orto: nome, comune, paese e coordinate arrotondate a circa 1 km, le aree, cosa hai seminato o trapiantato e quando, con le note che scrivi.
privacy.what.questions=Le tue domande e le risposte, chi ha chiesto e chi ha risposto quando una domanda attende una persona, e il contesto con cui è stata data la risposta (i nomi dell’orto e dell’area, la zona e il mese usati).
privacy.what.notifications=Le notifiche nell’app e via email.
privacy.what.usage=Quante domande fai e quanto costano, per i limiti giornalieri.
privacy.what.proposals=I fatti che proponi per la base di conoscenza, con la fonte e chi li ha approvati.
privacy.what.nothingelse=Non usiamo i dati per pubblicità o profilazione e non li vendiamo.
privacy.why.title=Perché e su quale base
privacy.why.text=Trattiamo questi dati per fornirti il servizio che hai chiesto (esecuzione del contratto): rispondere alle domande sul tuo orto, condividerlo con chi inviti, avvisarti di meteo e domande in attesa. I registri di utilizzo, lo storico dei ruoli e l’attribuzione dei fatti proposti servono per la sicurezza, il controllo dei costi e la tracciabilità della conoscenza (legittimo interesse).
privacy.who-receives.title=Chi li riceve
privacy.receives.anthropic=Anthropic (Claude, USA): il testo delle tue domande, i nomi degli orti dello spazio e delle aree dell’orto corrente (per riconoscere quello che la domanda nomina) e i fatti per formulare la risposta. Cancella i dati entro 30 giorni e non li usa per addestrare i modelli.
privacy.receives.typesafe=TypeSafe (Jev, USA): il testo della domanda per capire se riguarda l’orto, poi la domanda come è stata capita (tipo, coltura o area, zona, mese) e i fatti, mai il tuo login. Non li usa per addestrare i modelli.
privacy.receives.github=GitHub (USA): l’accesso con il tuo account GitHub, secondo la privacy di GitHub.
privacy.receives.google=Google (USA): l’accesso con il tuo account Google, solo per riconoscerti, secondo la privacy di Google.
privacy.receives.mail=Il servizio email che invia notifiche e inviti: l’indirizzo e il testo del messaggio.
privacy.receives.places=GeoNames (Svizzera): i nomi dei luoghi che cerchi e la posizione arrotondata dell’orto, per trovare il comune.
privacy.receives.weather=MET Norway (Norvegia): la posizione arrotondata dell’orto, per le previsioni.
privacy.receives.map=OpenFreeMap (tiles.openfreemap.org, dietro Cloudflare): la zona della mappa che stai guardando e il tuo indirizzo IP, mai i nomi degli orti né lo spazio. Tiene registri di accesso anonimi e registri di errore con l’IP per 7 giorni.
privacy.receives.telegram=Telegram (server di Telegram in Europa): lo spazio, l’orto, il titolo dell’avviso e il link per aprirlo, solo se colleghi Telegram. La domanda, la risposta e il testo degli avvisi restano qui; Telegram conserva i messaggi dei bot come ogni chat.
privacy.receives.transfers=Per Anthropic e TypeSafe il trasferimento negli USA è regolato dalle clausole contrattuali standard dell’UE nei loro accordi sul trattamento dei dati; GitHub e Google aderiscono all’EU-US Data Privacy Framework.
privacy.receives.questions=Le domande sono testo libero: non scriverci dati personali tuoi o di altri.
privacy.kept.title=Per quanto tempo
privacy.kept.history=Domande e risposte: {0,number,#} giorni.
privacy.kept.escalations=Domande che attendevano una persona, dopo la risposta: {0,number,#} giorni.
privacy.kept.notifications=Notifiche, dopo che sono lette o risolte: {0,number,#} giorni.
privacy.kept.usage=Registri di utilizzo: {0,number,#} giorni.
privacy.kept.invitations=Inviti accettati, revocati o scaduti: {0,number,#} giorni; l’indirizzo email dell’invitato si cancella subito.
privacy.kept.telegram=Codici Telegram e collegamenti che Telegram non consegna più: {0,number,#} giorni; un collegamento che funziona resta finché lo tieni.
privacy.kept.weather=Previsioni meteo della posizione arrotondata: 30 giorni.
privacy.kept.account=Account, orto e fatti proposti: finché li tieni o cancelli l’account.
privacy.rights.title=I tuoi diritti
privacy.rights.text=Puoi vedere e correggere i tuoi dati nell’app, scaricarli in un file e cancellare il tuo account dalla pagina Il mio account. Cancellando l’account si eliminano il tuo spazio personale con tutto il suo contenuto, le preferenze, le notifiche e l’utilizzo; in ciò che resta negli spazi condivisi il tuo login diventa «utente rimosso». Per opporti a un trattamento, limitarlo o per qualsiasi altra richiesta scrivi al contatto qui sopra.
privacy.rights.complaint=Puoi anche presentare reclamo al Garante per la protezione dei dati personali (www.garanteprivacy.it).
privacy.cookies.title=Cookie e memoria del browser
privacy.cookies.text=Usiamo solo ciò che serve a far funzionare l’app: nessun cookie di profilazione, nessun cookie pubblicitario, niente banner da accettare. Questo è quello che il tuo browser tiene per Rootology.
privacy.cookies.session=Il cookie di sessione, che si chiama JSESSIONID: tiene l’accesso e l’interfaccia. La stessa sessione conserva, per il tempo dell’accesso, il token di un invito aperto, il segno di un collegamento a un secondo account e lo stato dell’accesso in corso. Non è leggibile da JavaScript (HttpOnly), non parte con le richieste che altri siti fanno di nascosto (SameSite=Lax) e, quando l’app è in HTTPS, viaggia solo su HTTPS (Secure). Finisce quando esci o {0,number,#} minuti dopo che hai chiuso l’app (finché una sua pagina è aperta, la sessione resta attiva), e sparisce comunque chiudendo il browser.
privacy.cookies.theme=La scelta del tema chiaro, scuro o automatico, nella memoria locale del browser alla voce rootology.colorScheme. Resta finché non cancelli i dati del browser, non scade e non arriva ai nostri server.
privacy.cookies.gardenview=La scelta di vedere la mappa, la tabella o entrambe negli orti, nella memoria locale del browser alla voce rootology.gardenView. Resta finché non cancelli i dati del browser, non scade e non arriva ai nostri server.
privacy.cookies.providers=Durante l’accesso GitHub e Google mettono propri cookie sui propri domini, con le loro regole (docs.github.com/en/site-policy/privacy-policies/github-subprocessors-and-cookies e policies.google.com/technologies/cookies): non li vediamo e non li controlliamo noi.
