# Known vulnerabilities in dependencies (#41).
# The Maven submission sends the full dependency tree (transitive included) to GitHub's
# dependency graph, which Dependabot alerts and dependency review read; on its own GitHub
# sees only what pom.xml declares. OSV-Scanner is a second opinion from the OSV database;
# here it reports to Security > Code scanning without failing, pull requests fail on new ones.
name: dependencies

on:
  push:
    branches: [develop, main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  submit-maven-graph:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1

  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      runs-on: ubuntu-26.04
      fail-on-vuln: false
