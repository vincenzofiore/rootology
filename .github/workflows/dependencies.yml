# Known vulnerabilities in dependencies (#41).
# The Maven submission sends the full dependency tree (transitive included) to GitHub's
# dependency graph, which Dependabot alerts and dependency review read; on its own GitHub
# sees only what pom.xml declares. OSV-Scanner is a second opinion from the OSV database;
# here it reports to Security > Code scanning without failing, pull requests fail on new ones.
name: dependencies

on:
  push:
    branches: [develop, main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  submit-maven-graph:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1

  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      runs-on: ubuntu-26.04
      fail-on-vuln: false
