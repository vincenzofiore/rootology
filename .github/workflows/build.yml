# Offline build and tests on every push and pull request (#13), and the release image (#12).
# No secrets: a plain `./mvnw test` makes no paid call (live-api tests are excluded),
# and the Testcontainers tests (Postgres, Neo4j) use the runner's Docker.
name: build

on:
  push:
    branches: [develop, main]
    # A release: the owner tags a commit of main as vX.Y.Z.
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned, so the CI environment changes only when we decide (ubuntu-latest moves on its own).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp test
      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # The deployable image (#12, docs/operations.md), pushed to GitHub Container Registry once the tests pass:
  # for a push to main as `latest` and the commit; for a release tag vX.Y.Z (a commit of main) as `X.Y.Z` and
  # the commit, with a GitHub Release whose notes are generated from the pull requests and commits.
  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/vincenzofiore/rootology
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # Only a commit of main is released.
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
            echo "revision=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build the production jar
        env:
          REVISION: ${{ steps.version.outputs.revision }}
        # Without a tag, the version in pom.xml (X.Y.Z-SNAPSHOT).
        run: ./mvnw -B -ntp -Pproduction -DskipTests ${REVISION:+-Drevision=$REVISION} package
      - name: Build and push the image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$TAG" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:$TAG" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$TAG"
      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Skipped when the release was drafted on GitHub's Releases page, which created the tag.
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 \
              || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Rootology $GITHUB_REF_NAME"
