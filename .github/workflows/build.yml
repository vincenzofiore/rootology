# Offline build and tests on every push and pull request (#13).
# No secrets: a plain `./mvnw test` makes no paid call (live-api tests are excluded),
# and the Testcontainers tests (Postgres, Neo4j) use the runner's Docker.
name: build

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Pinned, so the CI environment changes only when we decide (ubuntu-latest moves on its own).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp test
      - name: Keep test reports when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # The deployable image (#12, docs/operations.md), pushed to GitHub Container Registry only for a push to
  # main whose tests passed: ghcr.io/vincenzofiore/rootology, tagged with the commit and `latest`.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/vincenzofiore/rootology
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build the production jar
        run: ./mvnw -B -ntp -Pproduction -DskipTests package
      - name: Build and push the image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
